<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Composición abstracta de asesoramiento inmobiliario premium">
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12203b"/>
      <stop offset="1" stop-color="#060b18"/>
    </linearGradient>
    <linearGradient id="hero-tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e5ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7c8cff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="hero-tower-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="hero-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="hero-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2e52" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0a1224" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="hero-glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#7c8cff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7c8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-glow-2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hero-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7c8cff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="hero-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="hero-card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" in="SourceAlpha"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo con bordes redondeados -->
  <rect width="640" height="640" rx="40" fill="url(#hero-bg)"/>
  <rect width="640" height="640" rx="40" fill="url(#hero-grid)"/>

  <!-- Halos radiales -->
  <circle cx="180" cy="180" r="240" fill="url(#hero-glow)"/>
  <circle cx="500" cy="500" r="220" fill="url(#hero-glow-2)"/>

  <!-- Planos geométricos difusos de fondo -->
  <g opacity="0.45" filter="url(#hero-soft)">
    <rect x="-40" y="380" width="360" height="220" rx="24" fill="#7c8cff" opacity="0.25"/>
    <rect x="380" y="80" width="280" height="220" rx="24" fill="#38bdf8" opacity="0.18"/>
  </g>

  <!-- Torre principal (contorno arquitectónico) -->
  <g transform="translate(240 120)">
    <!-- Sombra base -->
    <ellipse cx="80" cy="410" rx="130" ry="10" fill="#000" opacity="0.4" filter="url(#hero-soft)"/>

    <!-- Cuerpo de la torre -->
    <path d="M0,80 L160,80 L160,400 L0,400 Z" fill="url(#hero-tower)" stroke="url(#hero-tower-edge)" stroke-width="1.5"/>

    <!-- Ático -->
    <path d="M20,40 L140,40 L160,80 L0,80 Z" fill="url(#hero-tower)" stroke="url(#hero-tower-edge)" stroke-width="1.5"/>
    <line x1="20" y1="40" x2="140" y2="40" stroke="url(#hero-tower-edge)" stroke-width="1.5"/>

    <!-- Filas de ventanas: 8 pisos x 4 columnas -->
    <g fill="url(#hero-accent)">
      <!-- Piso 1 -->
      <rect x="16" y="98" width="24" height="30" rx="2" opacity="0.85"/>
      <rect x="52" y="98" width="24" height="30" rx="2" opacity="0.45"/>
      <rect x="88" y="98" width="24" height="30" rx="2" opacity="0.85"/>
      <rect x="124" y="98" width="24" height="30" rx="2" opacity="0.55"/>
      <!-- Piso 2 -->
      <rect x="16" y="138" width="24" height="30" rx="2" opacity="0.4"/>
      <rect x="52" y="138" width="24" height="30" rx="2" opacity="0.9"/>
      <rect x="88" y="138" width="24" height="30" rx="2" opacity="0.5"/>
      <rect x="124" y="138" width="24" height="30" rx="2" opacity="0.85"/>
      <!-- Piso 3 -->
      <rect x="16" y="178" width="24" height="30" rx="2" opacity="0.85"/>
      <rect x="52" y="178" width="24" height="30" rx="2" opacity="0.5"/>
      <rect x="88" y="178" width="24" height="30" rx="2" opacity="0.9"/>
      <rect x="124" y="178" width="24" height="30" rx="2" opacity="0.4"/>
      <!-- Piso 4 -->
      <rect x="16" y="218" width="24" height="30" rx="2" opacity="0.55"/>
      <rect x="52" y="218" width="24" height="30" rx="2" opacity="0.85"/>
      <rect x="88" y="218" width="24" height="30" rx="2" opacity="0.45"/>
      <rect x="124" y="218" width="24" height="30" rx="2" opacity="0.9"/>
      <!-- Piso 5 -->
      <rect x="16" y="258" width="24" height="30" rx="2" opacity="0.9"/>
      <rect x="52" y="258" width="24" height="30" rx="2" opacity="0.45"/>
      <rect x="88" y="258" width="24" height="30" rx="2" opacity="0.85"/>
      <rect x="124" y="258" width="24" height="30" rx="2" opacity="0.5"/>
      <!-- Piso 6 -->
      <rect x="16" y="298" width="24" height="30" rx="2" opacity="0.4"/>
      <rect x="52" y="298" width="24" height="30" rx="2" opacity="0.85"/>
      <rect x="88" y="298" width="24" height="30" rx="2" opacity="0.55"/>
      <rect x="124" y="298" width="24" height="30" rx="2" opacity="0.9"/>
    </g>

    <!-- Entrada -->
    <rect x="60" y="342" width="40" height="58" rx="4" fill="#0a1224" stroke="url(#hero-tower-edge)" stroke-width="1.5"/>
    <line x1="80" y1="346" x2="80" y2="398" stroke="url(#hero-tower-edge)" stroke-width="1"/>

    <!-- Base -->
    <rect x="-16" y="396" width="192" height="8" rx="2" fill="url(#hero-tower-edge)" opacity="0.6"/>
  </g>

  <!-- Edificio secundario izquierdo (silueta más baja) -->
  <g transform="translate(90 240)">
    <path d="M0,60 L110,60 L110,290 L0,290 Z" fill="url(#hero-tower)" stroke="#7c8cff" stroke-opacity="0.35" stroke-width="1.5"/>
    <path d="M15,30 L95,30 L110,60 L0,60 Z" fill="url(#hero-tower)" stroke="#7c8cff" stroke-opacity="0.35" stroke-width="1.5"/>
    <g fill="#7c8cff">
      <rect x="14" y="76" width="18" height="22" rx="2" opacity="0.7"/>
      <rect x="46" y="76" width="18" height="22" rx="2" opacity="0.4"/>
      <rect x="78" y="76" width="18" height="22" rx="2" opacity="0.7"/>
      <rect x="14" y="108" width="18" height="22" rx="2" opacity="0.4"/>
      <rect x="46" y="108" width="18" height="22" rx="2" opacity="0.7"/>
      <rect x="78" y="108" width="18" height="22" rx="2" opacity="0.4"/>
      <rect x="14" y="140" width="18" height="22" rx="2" opacity="0.7"/>
      <rect x="46" y="140" width="18" height="22" rx="2" opacity="0.4"/>
      <rect x="78" y="140" width="18" height="22" rx="2" opacity="0.7"/>
      <rect x="14" y="172" width="18" height="22" rx="2" opacity="0.4"/>
      <rect x="46" y="172" width="18" height="22" rx="2" opacity="0.7"/>
      <rect x="78" y="172" width="18" height="22" rx="2" opacity="0.4"/>
      <rect x="14" y="204" width="18" height="22" rx="2" opacity="0.7"/>
      <rect x="46" y="204" width="18" height="22" rx="2" opacity="0.4"/>
      <rect x="78" y="204" width="18" height="22" rx="2" opacity="0.7"/>
    </g>
    <rect x="-8" y="286" width="126" height="6" rx="2" fill="#7c8cff" opacity="0.45"/>
  </g>

  <!-- Tarjeta: Valor estimado -->
  <g transform="translate(60 90)" filter="url(#hero-card-shadow)">
    <rect x="0" y="0" width="220" height="96" rx="16" fill="url(#hero-card)" stroke="#7c8cff" stroke-opacity="0.4"/>
    <text x="20" y="30" font-family="Inter, Arial, sans-serif" font-size="12" fill="#7c8cff" font-weight="600" letter-spacing="1.5">VALOR ESTIMADO</text>
    <text x="20" y="60" font-family="Inter, Arial, sans-serif" font-size="24" fill="#ffffff" font-weight="700">USD 185.000</text>
    <text x="20" y="80" font-family="Inter, Arial, sans-serif" font-size="11" fill="#d9e5ff" opacity="0.7">Tasación de mercado</text>
    <!-- Mini gráfica -->
    <g transform="translate(140 46)">
      <path d="M0,32 L12,26 L24,30 L36,18 L48,22 L60,10" fill="none" stroke="url(#hero-accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="60" cy="10" r="3" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Chip: 3 amb · 78 m² -->
  <g transform="translate(420 200)" filter="url(#hero-card-shadow)">
    <rect x="0" y="0" width="170" height="44" rx="22" fill="url(#hero-card)" stroke="#38bdf8" stroke-opacity="0.5"/>
    <circle cx="22" cy="22" r="6" fill="url(#hero-accent)"/>
    <text x="40" y="27" font-family="Inter, Arial, sans-serif" font-size="13" fill="#d9e5ff" font-weight="600">3 amb · 78 m² · 2 baños</text>
  </g>

  <!-- Pin de ubicación con etiqueta -->
  <g transform="translate(420 300)" filter="url(#hero-card-shadow)">
    <rect x="0" y="0" width="180" height="60" rx="14" fill="url(#hero-card)" stroke="#7c8cff" stroke-opacity="0.4"/>
    <!-- pin -->
    <g transform="translate(20 18)">
      <path d="M12,0 C5.4,0 0,5.4 0,12 C0,20 12,32 12,32 C12,32 24,20 24,12 C24,5.4 18.6,0 12,0 Z" fill="url(#hero-accent)"/>
      <circle cx="12" cy="12" r="4.5" fill="#0a1224"/>
    </g>
    <text x="56" y="26" font-family="Inter, Arial, sans-serif" font-size="11" fill="#7c8cff" font-weight="600" letter-spacing="1">UBICACIÓN</text>
    <text x="56" y="44" font-family="Inter, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="600">Zona céntrica</text>
  </g>

  <!-- Sello: Tasación certificada -->
  <g transform="translate(60 470)" filter="url(#hero-card-shadow)">
    <rect x="0" y="0" width="210" height="54" rx="14" fill="url(#hero-card)" stroke="#38bdf8" stroke-opacity="0.45"/>
    <g transform="translate(18 15)">
      <circle cx="12" cy="12" r="12" fill="none" stroke="url(#hero-accent)" stroke-width="2"/>
      <path d="M6,12 L11,17 L18,8" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="52" y="24" font-family="Inter, Arial, sans-serif" font-size="11" fill="#38bdf8" font-weight="600" letter-spacing="1">CERTIFICADO</text>
    <text x="52" y="42" font-family="Inter, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="600">Tasación profesional</text>
  </g>

  <!-- Línea horizontal sutil "horizonte" -->
  <line x1="0" y1="530" x2="640" y2="530" stroke="#7c8cff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Puntos de brillo -->
  <g fill="#d9e5ff">
    <circle cx="90" cy="220" r="1.6" opacity="0.7"/>
    <circle cx="560" cy="120" r="2" opacity="0.6"/>
    <circle cx="600" cy="420" r="1.6" opacity="0.7"/>
    <circle cx="40" cy="380" r="1.4" opacity="0.5"/>
    <circle cx="320" cy="80" r="1.8" opacity="0.6"/>
  </g>
</svg>
